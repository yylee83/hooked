<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF7EE">
<title>Your downloads · Hooked on Pods</title>
<!-- Shown by public/sw.js when there's no signal. Plays the episodes saved by lib/downloads.js, and keeps your spot
     in the same place the app does (localStorage hooked:progress), so the app picks up where you left off. -->
<style>
  :root { --cobalt: #2340FF; --pink: #FF7AC6; --butter: #FFE14D; --ink: #15131D; --cream: #FFF7EE; --muted: #6b6676; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 140px; }
  .mark { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
  .mark span { display: inline-block; width: 34px; height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--pink) 55%, var(--butter) 55%); vertical-align: middle; margin-left: 6px; }
  h1 { font-size: 26px; margin: 22px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 2px solid #e8dfd3; }
  li .t { font-weight: 700; line-height: 1.25; }
  li .s { color: var(--muted); font-size: 14px; }
  .grow { flex: 1; min-width: 0; }
  button { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 14px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
  button:active { transform: translate(3px, 3px); box-shadow: none; }
  button.on { background: var(--butter); }
  .empty { border: 3px solid var(--ink); border-radius: 18px; background: #fff; padding: 18px; box-shadow: 4px 4px 0 var(--ink); }
  .bar { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 536px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 18px; padding: 12px 14px; display: none; }
  .bar.show { display: block; }
  .bar .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .bar button { background: transparent; color: #fff; border-color: #fff; box-shadow: none; padding: 5px 11px; }
  .bar input { flex: 1; accent-color: var(--pink); }
  .bar .time { font-family: ui-monospace, Menlo, monospace; font-size: 12px; opacity: 0.8; min-width: 44px; text-align: right; }
  .retry { margin-top: 22px; }
</style>
</head>
<body>
<main>
  <div class="mark">hooked on<span></span></div>
  <h1>You're offline</h1>
  <p class="sub">Your downloads still play. Everything else comes back with your signal.</p>
  <p class="mono">Downloads</p>
  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>Nothing downloaded on this phone yet. Next time you're online, tap <b>Download</b> on an episode.</div>
  <button class="retry" onclick="location.reload()">Try again</button>
</main>
<div class="bar" id="bar">
  <div class="t" id="now"></div>
  <div class="row">
    <button id="back" aria-label="Back 15 seconds">−15</button>
    <button id="pp">Pause</button>
    <button id="fwd" aria-label="Forward 30 seconds">+30</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Where you are in the episode">
    <span class="time" id="time"></span>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script>
(function () {
  function read(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var saved = read("hooked:downloads", {});
  var eps = Object.keys(saved).map(function (k) { return saved[k]; }).sort(function (a, b) { return b.at - a.at; });
  var list = document.getElementById("list");
  var audio = document.getElementById("audio");
  var bar = document.getElementById("bar");
  var pp = document.getElementById("pp");
  var seek = document.getElementById("seek");
  var time = document.getElementById("time");
  var current = null;
  var buttons = {};
  if (!eps.length) document.getElementById("empty").hidden = false;

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
  function key(ep) { return ep.ref || String(ep.id); }
  function spot(ep) { var p = read("hooked:progress", {})[key(ep)]; return p && p.t > 10 ? Math.max(0, p.t - 5) : 0; }
  var lastSave = 0;
  function save() {
    if (!current || !(audio.duration > 0)) return;
    var all = read("hooked:progress", {}), k = key(current), t = Math.floor(audio.currentTime), d = Math.floor(audio.duration);
    if (t >= 10 && t < d - 60) all[k] = { t: t, d: d, at: Date.now() }; else delete all[k];
    write("hooked:progress", all);
  }

  eps.forEach(function (ep) {
    var li = document.createElement("li");
    var info = document.createElement("div"); info.className = "grow";
    var t = document.createElement("div"); t.className = "t"; t.textContent = ep.title;
    var s = document.createElement("div"); s.className = "s"; s.textContent = ep.feedTitle + (ep.duration ? " · " + Math.round(ep.duration / 60) + " min" : "");
    info.appendChild(t); info.appendChild(s);
    var b = document.createElement("button"); b.textContent = "Play";
    b.onclick = function () { play(ep); };
    buttons[key(ep)] = b;
    li.appendChild(info); li.appendChild(b); list.appendChild(li);
  });

  function play(ep) {
    if (current && key(current) === key(ep)) { audio.paused ? audio.play() : audio.pause(); return; }
    save();
    current = ep;
    audio.src = "/downloads/audio/" + encodeURIComponent(key(ep));
    var at = spot(ep);
    audio.addEventListener("loadedmetadata", function () { if (at) audio.currentTime = at; }, { once: true });
    audio.load();
    audio.play().catch(function () {});
    document.getElementById("now").textContent = ep.title;
    bar.classList.add("show");
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: ep.feedTitle });
  }
  function paint() {
    Object.keys(buttons).forEach(function (k) {
      var on = current && key(current) === k && !audio.paused;
      buttons[k].textContent = on ? "Pause" : "Play";
      buttons[k].className = on ? "on" : "";
    });
    pp.textContent = audio.paused ? "Play" : "Pause";
  }
  pp.onclick = function () { audio.paused ? audio.play() : audio.pause(); };
  document.getElementById("back").onclick = function () { audio.currentTime = Math.max(0, audio.currentTime - 15); };
  document.getElementById("fwd").onclick = function () { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };
  seek.oninput = function () { if (audio.duration > 0) audio.currentTime = (seek.value / 1000) * audio.duration; };
  audio.addEventListener("play", paint);
  audio.addEventListener("pause", function () { paint(); save(); });
  // When one ends, the next download plays: on down the list, then round from the top, skipping ones already
  // played to the end here (YY, 2026-11-25; the app does the same, lib/downloads.js nextDownload).
  var done = {};
  audio.addEventListener("ended", function () {
    if (!current) return;
    done[key(current)] = true;
    var at = eps.findIndex(function (e) { return key(e) === key(current); });
    var order = eps.slice(at + 1).concat(eps.slice(0, at));
    var next = order.find(function (e) { return !done[key(e)]; });
    if (next) play(next);
    else { paint(); document.getElementById("now").textContent = "That's all your downloads."; }
  });
  audio.addEventListener("timeupdate", function () {
    if (audio.duration > 0) seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
    time.textContent = fmt(audio.currentTime);
    if (Date.now() - lastSave > 5000) { lastSave = Date.now(); save(); }
  });
  window.addEventListener("pagehide", save);
})();
</script>
</body>
</html>
